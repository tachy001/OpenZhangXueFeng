<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>OpenZhangXueFeng — 跟张雪峰唠嗑</title>
    <link rel="stylesheet" href="/static/style.css">
    <script>
        // Restore theme before paint to avoid flash. Default: dark.
        try {
            var t = localStorage.getItem('ozxf-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
    </script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="btn-new-chat" id="btnNewChat">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    新对话
                </button>
            </div>
            <div class="conversation-list" id="conversationList">
                <!-- Populated by JS -->
            </div>
            <div class="sidebar-footer">
                <button class="btn-theme-toggle" id="btnThemeToggle" title="切换深色/浅色模式">
                    <svg class="theme-icon-dark" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                    <svg class="theme-icon-light" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"/>
                        <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                    <span class="theme-toggle-label">浅色模式</span>
                </button>
                <span class="sidebar-brand">OpenZhangXueFeng</span>
            </div>
        </aside>

        <!-- Main chat area -->
        <div class="main-area">
            <!-- Header -->
            <header class="app-header">
                <div class="header-left">
                    <button class="btn-icon btn-menu" id="btnMenu" title="侧边栏">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
                        </svg>
                    </button>
                    <div class="avatar">
                        <span>峰</span>
                    </div>
                    <div class="header-info">
                        <h1>张雪峰</h1>
                        <span class="status-badge" id="statusBadge">
                            <span class="status-dot"></span>
                            <span class="status-text">在线</span>
                        </span>
                    </div>
                </div>
                <div class="header-right">
                    <button class="btn-icon btn-voice-toggle" id="btnVoiceToggle" title="切换语音回复模式">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
                            <path d="M19 10v2a7 7 0 01-14 0v-2"/>
                            <line x1="12" y1="19" x2="12" y2="23"/>
                        </svg>
                    </button>
                    <button class="btn-icon" id="btnCall" title="语音通话">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Chat messages -->
            <main class="chat-area" id="chatArea">
                <div class="chat-empty" id="chatEmpty">
                    <div class="empty-avatar">峰</div>
                    <h2>跟张雪峰唠唠</h2>
                    <p>有啥关于选专业、报志愿、考研、找工作的，尽管问</p>
                    <div class="quick-actions">
                        <button class="quick-btn" data-text="孩子想学计算机，靠谱吗？">💻 计算机专业怎么样</button>
                        <button class="quick-btn" data-text="文科生选什么专业好就业？">📚 文科生选什么专业</button>
                        <button class="quick-btn" data-text="考研到底值不值得？">🎓 考研值不值得</button>
                        <button class="quick-btn" data-text="金融行业还能进吗？">💰 金融行业还能进吗</button>
                    </div>
                </div>
            </main>

            <!-- Typing indicator -->
            <div class="typing-indicator" id="typingIndicator">
                <span></span><span></span><span></span>
                <span class="typing-text">张雪峰正在输入...</span>
            </div>

            <!-- Audio indicator -->
            <div class="audio-indicator" id="audioIndicator">
                <div class="audio-wave">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
                <span>正在播放语音...</span>
            </div>

            <!-- Input area -->
            <footer class="input-area">
                <div class="input-row">
                    <div class="input-wrapper">
                        <textarea
                            id="messageInput"
                            placeholder="有啥问题尽管问... (Enter发送)"
                            rows="1"
                        ></textarea>
                    </div>
                    <button class="btn-send" id="btnSend" title="发送">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"/>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </button>
                    <button class="btn-stop" id="btnStop" title="停止生成" style="display:none">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <rect x="4" y="4" width="16" height="16" rx="2"/>
                        </svg>
                    </button>
                </div>
                <div class="input-hint">
                    <span id="modeLabel">📝 文字模式</span>
                </div>
            </footer>
        </div>

        <!-- Voice Call Overlay -->
        <div class="call-overlay" id="callOverlay">
            <div class="call-content">
                <div class="call-avatar" id="callAvatar">
                    <span>峰</span>
                </div>
                <div class="call-status" id="callStatus">点击麦克风开始说话</div>
                <div class="call-timer" id="callTimer"></div>
                <div class="call-waveform" id="callWaveform">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
                <div class="call-actions">
                    <button class="btn-call-mic" id="btnCallMic" title="点击说话">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
                            <path d="M19 10v2a7 7 0 01-14 0v-2"/>
                            <line x1="12" y1="19" x2="12" y2="23"/>
                        </svg>
                    </button>
                    <button class="btn-call-end" id="btnCallEnd" title="挂断">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="1" y1="1" x2="23" y2="23" stroke-width="3"/>
                        </svg>
                    </button>
                </div>
                <div class="call-transcript user" id="callUserText"></div>
                <div class="call-transcript assistant" id="callAssistantText"></div>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
